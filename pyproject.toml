[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping_ai"
version = "0.1.0"
description = "AI Shopping Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "streamlit",
    "selenium",
    "webdriver-manager",
    "pandas",
    "numpy",
    "plotly",
    "beautifulsoup4",
    "lxml",
    "python-dotenv",
    "requests",
    "scikit-learn"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]